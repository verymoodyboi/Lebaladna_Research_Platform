services:
  backend:
    build:
      context: ./backend
    container_name: researcher_backend
    env_file:
      - ./backend/.env
    expose:
      - "3001"
    restart: unless-stopped
    networks:
      - researcher

  frontend:
    build:
      context: ./frontend
    container_name: researcher_frontend
    expose:
      - "80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - researcher

  nginx:
    image: nginx:alpine
    container_name: researcher_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - researcher

  certbot:
    image: certbot/certbot
    container_name: researcher_certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    networks:
      - researcher

networks:
  researcher: