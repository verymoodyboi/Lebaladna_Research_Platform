services:
  backend:
    build:
      context: ./backend
    container_name: researcher_backend
    env_file:
      - ./backend/.env
    ports:
      - "3001:3001"
    restart: unless-stopped
    networks:
      - researcher

  frontend:
    build:
      context: ./frontend
    container_name: researcher_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - researcher

networks:
  researcher: