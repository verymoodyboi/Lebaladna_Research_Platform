services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: researcher_backend
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    restart: unless-stopped
    networks:
      - researcher_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: researcher_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - researcher_network

networks:
  researcher_network:
    driver: bridge