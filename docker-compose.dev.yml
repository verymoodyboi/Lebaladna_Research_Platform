services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: researcher_backend_dev
    ports:
      - "3001:3001"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - researcher_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: researcher_frontend_dev
    ports:
      - "5173:5173"
    env_file:
      - ./frontend/.env
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - researcher_network

networks:
  researcher_network:
    driver: bridge